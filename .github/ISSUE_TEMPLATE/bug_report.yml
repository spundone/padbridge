name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: PadBridge version
      description: Settings › About
      placeholder: 0.8.0 (github build)
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 9, Android 16
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Computer / TV and OS
      placeholder: Windows 11 23H2 laptop, macOS 15, Android TV…
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "With the phone on adb: `adb logcat -d | grep -iE \"PadBridge|hidd|l2c_csm|BondState\"`"
      render: text
