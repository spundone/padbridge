name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build GitHub and Play flavors
        run: ./gradlew --no-daemon assembleGithubStandardRelease assembleGithubControlRelease assemblePlayStandardRelease lintGithubStandardRelease

      - uses: actions/upload-artifact@v4
        with:
          name: padbridge-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
